<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Silly Little Apps Hub</title>
    <meta name="description" content="A hub for my silly little projects.">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
    <div class="ios-app">
        <!-- iOS Navigation Bar -->
        <nav class="ios-navbar">
            <div class="nav-content">

                <button id="theme-btn" class="nav-action icon-btn" aria-label="Toggle Theme">
                    <!-- Icon injected by JS -->
                </button>
            </div>
        </nav>

        <main class="content-scroll">
            <div class="ios-list-group">
                <div class="ios-list-header">Projects</div>
                <div class="ios-list">
                    <!-- Need To Breath Cell -->
                    <a href="https://oxitorenk.github.io/need-to-breath" class="ios-cell" target="_blank">
                        <div class="cell-content">
                            <span class="cell-label">Need To Breath</span>
                            <div class="cell-value">
                                <span>Reduce Smoking</span>
                                <svg class="chevron" width="8" height="14" viewBox="0 0 8 14" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M1 13L7 7L1 1" />
                                </svg>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="ios-list-footer">
                    More silly little apps coming soon.
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
